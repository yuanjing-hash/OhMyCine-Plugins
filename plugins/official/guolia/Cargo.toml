[package]
name = "ohmycine-plugin-guolia"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.24"
urlencoding = "2"
url = "2"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "parsing"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
