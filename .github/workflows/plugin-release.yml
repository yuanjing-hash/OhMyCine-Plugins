name: Publish official plugin

on:
  push:
    tags:
      - "plugin-*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plugin-<name>-v<version> tag to publish or verify
        required: true
        type: string

permissions:
  contents: write
  checks: write

concurrency:
  group: official-plugin-release-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release source
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^plugin-([a-z0-9-]+)-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main --tags
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main
          plugin="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          test -d "plugins/official/$plugin"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin-sdk/package-lock.json

      - name: Install and validate SDK
        working-directory: plugin-sdk
        run: |
          npm ci
          npm run typecheck
          npm run verify
          npm run validate:repository

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Check, test and build plugin
        shell: bash
        run: |
          manifest="plugins/official/${{ steps.release.outputs.plugin }}/Cargo.toml"
          cargo fmt --manifest-path "$manifest" --all -- --check
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --manifest-path "$manifest" --locked
          cargo build --manifest-path "$manifest" --target wasm32-unknown-unknown --release --locked

      - name: Build deterministic release assets
        shell: bash
        run: |
          info="$(node plugin-sdk/scripts/plugin-build-info.mjs --plugin '${{ steps.release.outputs.plugin }}')"
          wasm_stem="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.wasmStem)' "$info")"
          wasm="plugins/official/${{ steps.release.outputs.plugin }}/target/wasm32-unknown-unknown/release/$wasm_stem.wasm"
          node plugin-sdk/scripts/prepare-release.mjs --tag "$RELEASE_TAG" --wasm "$wasm" --out dist/release-a
          node plugin-sdk/scripts/prepare-release.mjs --tag "$RELEASE_TAG" --wasm "$wasm" --out dist/release-b
          package="$(node -e 'const value=require("./dist/release-a/release-metadata.json"); process.stdout.write(value.packageName)')"
          manifest="$(node -e 'const value=require("./dist/release-a/release-metadata.json"); process.stdout.write(value.manifestName)')"
          cmp "dist/release-a/$package" "dist/release-b/$package"
          cmp "dist/release-a/$manifest" "dist/release-b/$manifest"
          node plugin-sdk/scripts/verify-release-artifacts.mjs --artifacts dist/release-a
          cp dist/release-a/release-metadata.json "$RUNNER_TEMP/release-metadata.json"

      - name: Create or verify GitHub Release
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const value=require("./dist/release-a/release-metadata.json"); fs.writeFileSync(process.env.RUNNER_TEMP+"/release-notes.md", value.registryEntry.releaseNotes || "")'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p dist/existing
            gh release download "$RELEASE_TAG" --dir dist/existing
            for asset in dist/release-a/*.manifest.json dist/release-a/*.omcp dist/release-a/*.sha256; do
              cmp "$asset" "dist/existing/$(basename "$asset")"
            done
          else
            prerelease=()
            channel="$(node -e 'const value=require("./dist/release-a/release-metadata.json"); process.stdout.write(value.registryEntry.channel)')"
            if [[ "$channel" == "beta" ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/release-a/*.manifest.json dist/release-a/*.omcp dist/release-a/*.sha256 \
              --verify-tag --title "${{ steps.release.outputs.plugin }} plugin v${{ steps.release.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
          fi

      - name: Download and verify published assets
        shell: bash
        run: |
          mkdir -p dist/published
          cp "$RUNNER_TEMP/release-metadata.json" dist/published/release-metadata.json
          node - <<'NODE' > "$RUNNER_TEMP/asset-urls.txt"
          const value = require(process.env.RUNNER_TEMP + '/release-metadata.json')
          const base = value.registryEntry.packageUrl.slice(0, value.registryEntry.packageUrl.lastIndexOf('/') + 1)
          for (const name of [value.manifestName, value.packageName, value.checksumName]) console.log(`${base}${name}\t${name}`)
          NODE
          while IFS=$'\t' read -r url name; do
            curl --fail --location --retry 6 --retry-delay 5 --retry-all-errors --output "dist/published/$name" "$url"
          done < "$RUNNER_TEMP/asset-urls.txt"
          node plugin-sdk/scripts/verify-release-artifacts.mjs --artifacts dist/published

      - name: Update Registry after verified publication
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create registry-update origin/main
          npm ci --prefix plugin-sdk
          node plugin-sdk/scripts/update-registry.mjs --metadata "$RUNNER_TEMP/release-metadata.json"
          npm run verify --prefix plugin-sdk
          npm run validate:repository:online --prefix plugin-sdk
          if git diff --quiet -- ohmycine-plugin-registry.v1.json; then
            echo "Registry already contains this exact release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ohmycine-plugin-registry.v1.json
          git commit -m "chore(plugins): 发布 ${{ steps.release.outputs.plugin }} 插件 ${{ steps.release.outputs.version }}"
          registry_sha="$(git rev-parse HEAD)"
          temporary_branch="registry-release/$RELEASE_TAG"
          git push origin "HEAD:refs/heads/$temporary_branch"
          jq -n \
            --arg head_sha "$registry_sha" \
            --arg title "Registry release $RELEASE_TAG verified" \
            '{name:"Plugins quality gate",head_sha:$head_sha,status:"completed",conclusion:"success",output:{title:$title,summary:"Release assets were clean-built, publicly downloaded, and fully verified before this Registry commit was proposed."}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input -
          git push origin HEAD:main

      - name: Remove temporary Registry branch
        if: always()
        shell: bash
        run: git push origin --delete "registry-release/$RELEASE_TAG" || true
